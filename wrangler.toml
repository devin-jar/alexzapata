compatibility_flags = [ "nodejs_compat" ]

# Configuración para la rama de desarrollo
[env.dev]
name = "alexzapata-dev"
route = "://alexzapata.com*"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
